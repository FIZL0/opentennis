# The whole of FIZL0/opentennis-beta (as .github/workflows/deploy.yml): that repo holds no site, only this. Each beta
# run of this repo's pages.yml leaves the whole beta site (website + /download/, tools/beta-bundle.sh) as
# beta-site.tar.gz on a draft release of that repo and dispatches this with the draft's id; it puts the bundle on its
# GitHub Pages (custom domain beta.opentennis.dev). B745: not a release of FIZL0/opentennis any more (launchers took
# the rolling "beta" for the newest version); drafts are hidden, so nothing here is offered as a version either.
# Run it by hand from that repo's Actions tab too (the newest draft). pages.yml checks this file has
# "beta-site.tar.gz" in it before it stops making the old release: copy this file there when it changes.
name: deploy
on:
  repository_dispatch:
    types: [beta]
  workflow_dispatch:
permissions:
  contents: write  # drafts are only visible with push access
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # B755: upload and deploy in separate jobs (GitHub's Pages layout). In one job deploy-pages listed the artifact
  # half a second after upload and sometimes found none.
  build:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.client_payload.release }}
        run: |
          [ -n "$ID" ] || ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.draft)][0].id')
          [[ $ID =~ ^[0-9]+$ ]] || { echo "::error::no beta draft"; exit 1; }
          a=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" -q '.assets[] | select(.name == "beta-site.tar.gz") | .id')
          mkdir web && gh api "repos/$GITHUB_REPOSITORY/releases/assets/$a" -H 'Accept: application/octet-stream' | tar xz -C web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
