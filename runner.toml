# Unattended runs: `tmux new -s hst agent-runner run [N|once] [--force] [--shutdown]`, through agent-runner: https://github.com/FIZL0/agent-runner
[plan]
dir = "plan"
journal = "research/journal"
brief_extra = "tools/cleanroom.py {id}" # a SPEC.md's spec/port phase; in a slot's worktree it writes the .cleanroom lock
lookup = ["PLAN.md", "plan/CODEMAP.md", "plan/GUIDE.md"]

[run]
auto_upgrade = true  # upgrade agent-runner by itself when a newer release is out, between merges
# Claude Code (Opus) runs every session. For other providers (Codex, Copilot, ...) the runner can use Pi
# instead: `AGENT_RUNNER_BACKEND=pi agent-runner run once`, or `backend = "pi"` here. Pi slots keep the repo's
# PreToolUse guards (.claude/settings.json) but not the inbox hook. Pi on an Anthropic model bills extra usage.
backend = "claude"
model = "opus"
test = "tools/check.sh"
slots = 4
slot_max_gb = 150 # trimmed stalest-first to half this; slots run 16-60 GB with warm builds
min_free_gb = 100 # under this, free worktrees are cleaned and no task starts
weekly_max = 94
notes = "context/notes"
rules = "AGENT.md"
prompt = "tools/runner-prompt.md"
links = ["context", "fixtures", "mods", "replacements", "*.iso"]
shared_files = ["play.rs"]
joinable = ["plan/*.md", "plan/tasks/*.md", "research/journal/*", "RELEASE_NOTES.md"]
slot_env = [
  "HST_PCSX2={n}",
  "HST_PCSX2_MAX_HOLD=1200",
  "HST_BG=1",
  "RUSTC_WRAPPER=sccache",
  "SCCACHE_CACHE_SIZE=60G",
]
on_exit = "tools/pcsx2.sh tools/pcsx2-hst.sh stop; tools/context_sync.py -q --link; tools/worktree-gc.sh; tools/target-sweep.sh"
before_start = "ls /run/user/$(id -u)/wayland-[0-9]* >/dev/null 2>&1" # PCSX2 needs this user's desktop session
untested = ["*.md", "LICENSE*", ".github/*", "tools/*", "!tools/check.sh"]
failures = '^---- (\S+) stdout ----'
retest = "tools/check.sh -- --exact {names}"
# A merge-fix/repair session builds every test target before it commits, so a clash git merged cleanly (two sides
# adding one name) fails there, not in the gate after it. Outside the check slots: one slot's share of the cores.
build = "cargo test -q --workspace --no-run --message-format=short -j $(( $(nproc) / 4 ))"
not_attempt = '^{id} spec:' # a clean-room spec phase; the port phase starts once it merges
suspect = 'BLOCKED:.*(pcsx2|pine|capture|record|screenshot|save state|unattended)'
