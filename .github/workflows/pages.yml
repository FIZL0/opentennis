# The browser build (`tools/web.sh`) on GitHub Pages, https://opentennis.dev: the page and the wasm only, no game data
# (players pick their ISO). Builds of the game are published only as tools/release.sh's vX.Y.Z releases (P147: no beta
# site or beta builds any more). Which website goes on opentennis.dev is the repo variable SITE_FROM:
#   unset / main   every push to main that passes ci.yml (tests, clippy, cargo-deny: the `ci` job)
#   release        only published releases (tools/release.sh): `gh variable set SITE_FROM --body release`; a push
#                  to main then runs only the `ci` job
# tools/ship-local.sh builds the website on the dev machine and runs this with `prebuilt`: that run only deploys the
# uploaded web/ to opentennis.dev (while SITE_FROM isn't release). The upload comes as a draft release (`release`: its
# id), which the `prebuilt` job takes in and deletes.
# A release made by tools/release.sh carries its own web.tar.gz, which its run deploys without building (~1 min).
name: pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prebuilt:
        description: deploy the web/ that tools/ship-local.sh uploaded (the draft release `release`) instead of building
        type: boolean
        default: false
      release:
        description: with prebuilt, the id of tools/ship-local.sh's web-prebuilt draft release
        type: string
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
# a running deploy always finishes (builds take ~20 min, merges come faster); GitHub keeps only the newest queued one
# tools/ship-local.sh's prebuilt deploys have their own group, so they don't wait behind a build
concurrency:
# releases have their own group too: a queued push run must not replace a queued release deploy
  group: pages-${{ github.event_name }}${{ inputs.prebuilt && '-prebuilt' || '' }}
  cancel-in-progress: false
jobs:
  # B745: ship-local.sh's upload, a draft release (hidden: never a version to launchers), becomes this run's
  # web-prebuilt artifact and the draft is deleted. Only this job may see drafts (contents: write); it runs no build.
  prebuilt:
    if: ${{ inputs.prebuilt }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ inputs.release }}
        run: |
          [[ $ID =~ ^[0-9]+$ ]] || { echo "::error::no release id (tools/ship-local.sh passes it)"; exit 1; }
          r=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID")
          # never a real release, whatever id was given
          [ "$(jq -r '.draft and .tag_name == "web-prebuilt"' <<< "$r")" = true ] || { echo "::error::release $ID is not a web-prebuilt draft"; exit 1; }
          a=$(jq -r '.assets[] | select(.name == "web.tar.gz") | .id' <<< "$r")
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$a" -H 'Accept: application/octet-stream' > web.tar.gz
          tar tzf web.tar.gz >/dev/null
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: web-prebuilt
          path: web.tar.gz
  build:
    needs: [prebuilt]
    # only the site opentennis.dev shows is built: releases' when SITE_FROM is release, else main's
    if: ${{ !cancelled() && (needs.prebuilt.result == 'success' || needs.prebuilt.result == 'skipped') && (github.event_name == 'release') == (vars.SITE_FROM == 'release') }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.prebuilt }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: web-prebuilt
      # a site built elsewhere: ship-local.sh's, or the web.tar.gz tools/release.sh attaches to a release (an older
      # release without one is built here as before)
      - id: pre
        if: ${{ inputs.prebuilt || github.event_name == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir web
          if [ "${{ inputs.prebuilt }}" = true ]; then tar xzf web.tar.gz -C web && rm web.tar.gz && echo got=1 >> "$GITHUB_OUTPUT"
          elif gh release download "$TAG" -R "${{ github.repository }}" -p web.tar.gz -O - | tar xz -C web; then echo got=1 >> "$GITHUB_OUTPUT"
          else rm -rf web; fi
      - if: ${{ !steps.pre.outputs.got }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      # the version and targets in rust-toolchain.toml
      - if: ${{ !steps.pre.outputs.got }}
        run: rustup toolchain install
      - if: ${{ !steps.pre.outputs.got }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target-wasm"  # tools/web.sh builds there, not in target/
      - if: ${{ !steps.pre.outputs.got }}
        name: Tools
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
          # Ubuntu's binaryen is too old for rustc's wasm features
          curl -sSfLO https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  binaryen-version_123-x86_64-linux.tar.gz" | sha256sum -c -
          tar xzf binaryen-version_123-x86_64-linux.tar.gz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - if: ${{ !steps.pre.outputs.got }}
        # M22: the online build id's commit (crates/hst/build.rs)
        run: HST_COMMIT=${GITHUB_SHA::7} tools/web.sh
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: web
  deploy:
    needs: [build, ci]
    # ci is skipped only for releases and prebuilt deploys
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (github.event_name == 'release') == (vars.SITE_FROM == 'release') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a stale run doesn't put an older site back over a newer one (e.g. one tools/ship-local.sh deployed)
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        # a release deploys its own tag, whatever main is at
        run: |
          [ "$GITHUB_EVENT_NAME" = release ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" = "$GITHUB_SHA" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "main moved on, skipping"
      - if: ${{ steps.fresh.outputs.ok }}
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
  # T4: tests, clippy and cargo-deny (ci.yml); the site deploy of a push waits for it. Releases and ship-local.sh's
  # prebuilt deploys skip it (a release's commit was tested when it was pushed to main)
  ci:
    if: ${{ !inputs.prebuilt && github.event_name != 'release' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
