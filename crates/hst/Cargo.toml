[package]
name = "hst"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

# Android (`tools/apk.sh`): the game as a NativeActivity .so; only built when asked for, never by `cargo test`
# (src/android_so.rs is a symlink to main.rs: the same file under its own name, B618, or Cargo warns that main.rs is in
# two build targets on every build)
[[example]]
name = "hst"
path = "src/android_so.rs"
crate-type = ["cdylib"]
required-features = ["android"]
test = false

[dependencies]
hst-data = { path = "../hst-data" }
hst-sim = { path = "../hst-sim" }
hst-base = { path = "../hst-base" }
hst-play = { path = "../hst-play" }
# `debug`: type names, which `mode.rs` tells its resources by; `bevy_debug_stepping`: its executor's skip list, which
# `mode.rs` runs a mode's start a slice a frame with (P50)
bevy = { version = "0.19.1", features = ["debug", "bevy_debug_stepping"] }
serde_json = "1"
# `SystemTime` that also works in the browser (std's panics on wasm32-unknown-unknown)
web-time = "1"
# the select cards' PNG encode and the umpire mods' pictures (`play/main_menu/previews.rs`, `umpire_mods.rs`; bevy's own image crate)
image = { version = "0.25", default-features = false, features = ["png"] }
# the self-updater's downloads (`update.rs`): reqwest streamed through n0-future, on tokio natively (all already built
# for hst-base's netplay)
n0-future = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# B492: only for `ship`'s compile-time log cap (both already in the lock via bevy)
log = "0.4"
tracing = { version = "0.1", default-features = false }
# the self-updater's download check (`update.rs`; already built for iroh)
sha2 = "0.11"

# copy/paste of join codes through the OS clipboard (arboard: none on iOS/Android, where it stays in-app)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
bevy = { version = "0.19.1", features = ["system_clipboard"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Location", "Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the window icon (`main.rs` window_icon), on bevy's own winit
winit = { version = "0.30", default-features = false }
# the crypto reqwest uses for the self-updater's downloads (`update.rs` get): iroh's own ring
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# B374: the self-updater's check of a release's signed SHA256SUMS (`update.rs`; no dependencies). iOS builds it too:
# the app bundle can't be written, so there it only offers the release page
minisign-verify = "0.3"

[dev-dependencies]
# hst-base's test helpers for this crate's tests
hst-base = { path = "../hst-base", features = ["testing"] }
# the disc and fixtures/ recordings for this crate's tests (`hst_data::fixture`)
hst-data = { path = "../hst-data", features = ["testing"] }
# a fresh node id for the join-code paste tests (`play/main_menu/online.rs`)
iroh = "1.3"

[features]
# the browser build on WebGPU (`tools/web.sh` builds it beside the default WebGL2 one; the page picks)
webgpu = ["bevy/webgpu", "hst-base/webgpu"]
# the Android .so (`tools/apk.sh`)
android = ["bevy/android-native-activity"]
# B492: a build players get (tools/build.sh, apk.sh, ios-ipa.sh, web.sh, pages.yml): debug/trace logs compiled out, the
# developers' HST_* variables ignored (`main.rs` dev_env). Tests, `cargo run` and tools/shot.sh's release builds keep both
ship = ["log/release_max_level_info", "tracing/release_max_level_info"]

[lints.clippy]
# Bevy systems take each query and resource as its own parameter, and queries spell out their filters: clippy's
# defaults for both fire on ordinary systems (Bevy's own projects turn them off the same way)
type_complexity = "allow"
too_many_arguments = "allow"
