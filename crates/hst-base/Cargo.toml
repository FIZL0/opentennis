[package]
name = "hst-base"
version.workspace = true
edition = "2024"
license = "MIT OR Apache-2.0"

# The lower layer of the game (P60, `src/lib.rs`): split out of `hst` so an edit in the match or the menus rebuilds less.
[dependencies]
hst-data = { path = "../hst-data" }
hst-sim = { path = "../hst-sim" }
# `debug`: type names, which hst-play's `mode.rs` tells its resources by; `bevy_debug_stepping`: its executor's skip list,
# which `mode.rs` runs a mode's start a slice a frame with (P50)
bevy = { version = "0.19.1", features = ["debug", "bevy_debug_stepping"] }
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
serde_json = "1"
# `SystemTime` that also works in the browser (std's panics on wasm32-unknown-unknown)
web-time = "1"
serde = { version = "1", features = ["derive"] }
# P55: the recorded render pipelines' wgpu states as JSON (`pipelines.rs`; the version bevy already builds)
wgpu-types = { version = "29", features = ["serde"] }
# mods' PNGs: decode, resize, encode (`mods.rs`, `modfs.rs`, `inspect.rs`, …; bevy's own image crate)
image = { version = "0.25", default-features = false, features = ["png"] }
# netplay transport (`net.rs`): iroh QUIC (relay-only in the browser), tickets for codes/links; tasks and timers through
# n0-future (tokio natively, the browser's event loop on wasm)
iroh = "1.3"
iroh-tickets = "1"
n0-future = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
# the browser's LAN codes (M2k, `net/rtc.rs`)
data-encoding = "2"
# short lobby codes through a pkarr relay (`net.rs`; iroh already builds it: rustls natively, fetch in the browser)
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# mod zips (M16, `modfs.rs`): deflate, already built for png
miniz_oxide = "0.8"
# the mod store's download check (M17, `modstore.rs`; already built for iroh)
sha2 = "0.11"

# copy/paste of join codes through the OS clipboard (arboard: none on iOS/Android, where it stays in-app)
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
bevy = { version = "0.19.1", features = ["system_clipboard"] }

# iOS: stderr into the app's log file (`ios.rs`); the window's view for the on-screen pad's safe area (hst-play's `play/touch_pad.rs`)
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
# P28: the GPU's frame time from Metal's command buffers (`graphics.rs` gpu_time); the versions wgpu-hal already uses
objc2 = "0.6"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLCommandBuffer"] }
block2 = "0.6"
# P49: a display link asking ProMotion for 120 Hz (`ios.rs` frame_rate); the versions wgpu-hal already uses
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CADisplayLink", "CAFrameRateRange"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSRunLoop", "NSString", "NSObjCRuntime"] }
wgpu = "29"
raw-window-handle = "0.6"

# M99: the Android start page's file picker and restart (`android.rs` → `android/…/HstActivity.java`)
# M101: the input device list for gamepad hot-plug (`android_pad.rs`; the version android-activity already builds)
# M102: the window's safe area and the on-screen pad's haptic tick through JNI (`android.rs`; android-activity's own jni)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# M105: stderr and the engine log into hst-log.txt (`android.rs`)
libc = "0.2"
# B454: the root certificates the app's HTTPS checks against (`android.rs` tls; the version iroh-relay already builds)
webpki-roots = "1"
# B418: the phone's own certificate check for that HTTPS (`android.rs` init_tls, tls; the versions reqwest already builds;
# its Java classes go into the APK in tools/apk.sh)
rustls-platform-verifier = "0.7"
jni22 = { package = "jni", version = "0.22", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "Document", "DomRect", "Element", "File", "FileReaderSync", "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions", "Location", "Storage", "UrlSearchParams", "Window", "MessageEvent", "RtcPeerConnection", "RtcPeerConnectionState", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType", "RtcIceGatheringState", "WebSocket", "BinaryType"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# M152b: the native end of the browser's LAN (WebRTC data channels, `net/rtc/native.rs`; pure-Rust crypto so it builds
# for every native target)
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# its host candidates: this machine's LAN addresses (the version iroh's netwatch already builds; also M152a's `adhoc.rs`)
netdev = "0.46"
# Android's gamepads and lifecycle (`android_pad.rs`, `android.rs`), on bevy's own winit
winit = { version = "0.30", default-features = false }
# lobbies: addresses and lobby list on the mainline DHT and LAN mDNS (UDP: not in the browser)
iroh-mainline-address-lookup = "0.6"
n0-mainline = "0.7"
# M152a adhoc hosting (`adhoc.rs`): the LAN addresses to show (`netdev`, above), a release's
# web.tar.gz unpacked (already built for reqwest/iroh), the address as a QR code
flate2 = "1"
qrcode = { version = "0.14", default-features = false }
# the crypto reqwest uses for the pkarr relay (`net.rs` relay_get, `modstore.rs`): iroh's own ring
rustls = { version = "0.23", default-features = false, features = ["ring"] }
iroh-mdns-address-lookup = "0.6"
# (`net`, `io-util`: M152b's UDP sockets and signalling listener, `net/rtc/native.rs`)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }


# M154: ARM Linux handhelds (Mali GPUs with no Vulkan driver): wgpu's GL ES backend beside Vulkan (the version bevy
# already builds; EGL is loaded at run time, nothing more to link)
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
wgpu = { version = "29", features = ["gles"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "android")))'.dependencies]
# Add mod's file picker on desktop (the xdg portal on Linux; the browser build uses the page's input, iOS the Files app; none on Android)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[features]
# the browser build on WebGPU (`hst`'s `webgpu` turns it on)
webgpu = ["bevy/webgpu"]
# test helpers (`Sound::test`, `Net::wired`, …) for the crates above's tests (`hst`'s dev-dependency turns it on)
testing = []

[dev-dependencies]
# the disc and fixtures/ recordings for this crate's tests (`hst_data::fixture`)
hst-data = { path = "../hst-data", features = ["testing"] }

[lints.clippy]
# Bevy systems take each query and resource as its own parameter, and queries spell out their filters: clippy's
# defaults for both fire on ordinary systems (Bevy's own projects turn them off the same way)
type_complexity = "allow"
too_many_arguments = "allow"
